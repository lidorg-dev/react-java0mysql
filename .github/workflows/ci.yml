name: CI Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push images using Docker Compose
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          # Log in to ECR
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

          # Build and tag the images using Docker Compose
          docker-compose -f ./docker-compose.yml build
          
          # Get ECR repository URI
          REPOSITORY_URI=$(aws ecr describe-repositories --repository-names $ECR_REPOSITORY --region ${{ secrets.AWS_REGION }} --query "repositories[0].repositoryUri" --output text)
          
          # Tag the images with ECR repository URI
          services=$(docker-compose -f ./docker-compose.yml config --services)
          for service in $services; do
            docker tag ${service}:$IMAGE_TAG $REPOSITORY_URI/$service:$IMAGE_TAG
          done

          # Push the images to ECR
          for service in $services; do
            docker push $REPOSITORY_URI/$service:$IMAGE_TAG
          done


      - name: Logout from Amazon ECR
        run: docker logout https://$REPOSITORY_URI